<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight — UI Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #drop-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        color: #ccc;
        font:
          18px/1 system-ui,
          sans-serif;
        z-index: 10;
        pointer-events: none;
      }
      #drop-overlay.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="drop-overlay">Drop a .flight file to view</div>
    <canvas id="canvas"></canvas>
    <script type="module" src="./src/entry.ts"></script>
  </body>
</html>
